[package]
name = "analysant"
description = "AnalysAnt: document analysis for plans, specs and code; slice 1 reads claims out of documents and checks them against a plan"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
analysant-core = { path = "../analysant-core", version = "0.3.0" }
analysant-lexical = { path = "../analysant-lexical", version = "0.3.0" }
analysant-pragmatic = { path = "../analysant-pragmatic", version = "0.3.0" }
toml = { version = "1.2.1", default-features = false, features = ["parse", "serde", "std"] }
analysant-logical = { path = "../analysant-logical", version = "0.3.0" }
analysant-rust = { path = "../analysant-rust", version = "0.3.0" }
analysant-semantic = { path = "../analysant-semantic", version = "0.3.0" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
