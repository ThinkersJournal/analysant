name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    name: Build, test, clippy, fmt (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo build --locked --workspace --all-targets
      - run: cargo test --locked --workspace --no-fail-fast

  # Slice 5's real-tree gate (pm-ants 2026-11-19): the reference tree is public, so GitHub can run it; it must fail, not skip.
  reference-gate:
    name: Gate A rows on the reference tree (fuel@b0d74efa)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ThinkersJournal/fuel
          ref: b0d74efafed63d9700ec62f652468b197dd46a88
          path: reference-fuel
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
      - name: The checked-out tree is the one the gate was measured on
        run: |
          test "$(git -C reference-fuel rev-parse HEAD)" = b0d74efafed63d9700ec62f652468b197dd46a88
          n=$(find reference-fuel -name '*.rs' -not -path '*/.git/*' | wc -l)
          echo "rs files: $n"
          test "$n" -eq 951
      - run: cargo test --locked -p analysant-rust --test gate_rows -- --nocapture
        env:
          ANALYSANT_REFERENCE_CODE: ${{ github.workspace }}/reference-fuel
          ANALYSANT_REQUIRE_REFERENCE: "1"
      - run: cargo test --locked -p analysant --test doccode_real -- --nocapture
        env:
          ANALYSANT_REFERENCE_CODE: ${{ github.workspace }}/reference-fuel
          ANALYSANT_REQUIRE_REFERENCE: "1"

  deny:
    name: cargo deny (advisories, licences, bans, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check advisories licenses bans sources

  spdx:
    name: Every source file declares the licence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Self-test the gate (it must be able to fail)
        run: bash .github/spdx_gate.sh --self-test
      - name: Every tracked source file declares the licence
        run: bash .github/spdx_gate.sh

  # Advisory (CireSnave 2026-10-23): not a required check, no rule silenced. Pinned to a commit on coderipper's main
  # (portfolio.yml last changed there; Cargo.toml says 0.48.1). Public repo: default GitHub-hosted runner.
  portfolio:
    permissions:
      contents: read
    uses: ciresnave/coderipper/.github/workflows/portfolio.yml@467fd259d6d062cba4c5683d310f1a6f2b66e763 # 0.48.1
